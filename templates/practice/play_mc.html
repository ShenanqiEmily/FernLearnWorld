{% extends 'base.html' %}
{% load static %}

{% block title %}{{ mode.label }} | Practice Hub{% endblock title %}

{% block content %}

<style>
    .fern-quiz-page {
        padding: 24px 34px;
        background: #fff7fb;
    }

    .fern-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        margin-bottom: 22px;
        flex-wrap: wrap;
    }

    .fern-title {
        font-size: 30px;
        font-weight: 900;
        color: #0f172a;
    }

    .fern-sub {
        color: #64748b;
    }

    .fern-progress-wrap {
        width: 260px;
    }

    .fern-progress {
        width: 100%;
        height: 12px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 10px;
    }

    .fern-progress span {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6);
        transition: .3s;
    }

    .fern-quiz-card {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 30px;
        padding: 34px;
        border: 1px solid #fbcfe8;
        box-shadow: 0 14px 36px rgba(236, 72, 153, .08);
        text-align: center;
    }

    .fern-front-text {
        font-size: 22px;
        font-weight: 800;
        color: #0f172a;
        line-height: 1.6;
        margin-bottom: 8px;
    }

    .fern-front-char {
        font-size: clamp(56px, 10vw, 96px);
        font-weight: 900;
        color: #0f172a;
    }

    .fern-audio-btn {
        border: none;
        background: linear-gradient(135deg, #ec4899, #8b5cf6);
        color: white;
        font-size: 40px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(139, 92, 246, .25);
    }

    .fern-options {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        margin-top: 26px;
    }

    .fern-option {
        border: 2px solid transparent;
        border-radius: 18px;
        padding: 18px;
        background: #f8fafc;
        text-align: left;
        font-size: 17px;
        font-weight: 800;
        transition: .15s;
    }

    .fern-option:hover {
        border-color: #c4b5fd;
        background: #faf5ff;
    }

    .fern-option.correct {
        background: #ecfdf5;
        border-color: #10b981;
        color: #047857;
    }

    .fern-option.wrong {
        background: #fef2f2;
        border-color: #ef4444;
        color: #b91c1c;
    }

    .fern-result {
        margin-top: 22px;
        border-radius: 18px;
        padding: 16px;
        display: none;
        font-weight: 900;
    }

    .fern-result.correct { background: #ecfdf5; color: #047857; }
    .fern-result.wrong { background: #fef2f2; color: #b91c1c; }

    .fern-score-box {
        margin-top: 18px;
        font-weight: 800;
        color: #64748b;
    }

    .fern-btn-row {
        margin-top: 26px;
    }

    .fern-btn, .fern-btn-light {
        padding: 14px 24px;
        border-radius: 16px;
        text-decoration: none;
        font-weight: 900;
        border: none;
        display: inline-block;
    }

    .fern-btn {
        background: linear-gradient(135deg, #ec4899, #8b5cf6);
        color: white !important;
    }

    .fern-btn-light {
        background: #eff6ff;
        color: #2563eb !important;
        border: 1px solid #bfdbfe;
    }
</style>

<div class="fern-quiz-page">

    <div class="fern-top">
        <div>
            <div class="fern-title">{{ mode.icon }} {{ mode.label }}</div>
            <div class="fern-sub">{{ title }}</div>
        </div>

        <div class="fern-progress-wrap">
            <div id="mcCounter">1 / {{ items|length }}</div>
            <div class="fern-progress"><span id="mcProgress"></span></div>
        </div>
    </div>

    <div class="fern-quiz-card">

        <div id="mcFrontText" class="fern-front-text" style="display:none;"></div>
        <div id="mcFrontChar" class="fern-front-char" style="display:none;"></div>
        <button id="mcAudioBtn" class="fern-audio-btn" style="display:none;" onclick="mcPlayAudio()">🔊</button>

        <div class="fern-options" id="mcOptions"></div>
        <div class="fern-result" id="mcResult"></div>
        <div class="fern-score-box" id="mcScoreBox">คะแนน: 0%</div>

        <div class="fern-btn-row">
            <a href="{% url 'practice:mode_picker' mode=mode_key %}" class="fern-btn-light">← กลับ</a>
            <a id="mcFinishBtn" href="#"
                data-complete-url="{% url 'practice:complete' mode=mode_key course_code=group %}"
                class="fern-btn" style="display:none;">ส่งคะแนน →</a>
        </div>

    </div>

</div>

{{ items|json_script:"mc-items" }}
<script>
    window.PRACTICE_MODE_KEY = "{{ mode_key|escapejs }}";
</script>
<script src="{% static 'js/utils/speech-lang.js' %}"></script>
<script src="{% static 'js/pages/practice_mc.js' %}"></script>

{% endblock content %}
