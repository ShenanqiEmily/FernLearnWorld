{% extends 'base.html' %}
{% load static %}

{% block title %}Speaking Practice | Practice Hub{% endblock title %}

{% block content %}

<style>
    .fern-practice-speak-page {
        padding: 24px 34px;
        background: #fff7fb;
    }

    .fern-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 24px;
    }

    .fern-title {
        font-size: 30px;
        font-weight: 900;
        color: #0f172a;
    }

    .fern-progress-wrap {
        width: 260px;
    }

    .fern-progress {
        height: 12px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
    }

    .fern-progress span {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6);
    }

    .fern-card {
        max-width: 760px;
        margin: 0 auto;
        background: white;
        border-radius: 30px;
        padding: 34px;
        border: 1px solid #fbcfe8;
        box-shadow: 0 14px 36px rgba(236, 72, 153, 0.1);
        text-align: center;
    }

    .fern-word {
        font-size: clamp(34px, 5vw, 56px);
        font-weight: 900;
        color: #0f172a;
        margin-bottom: 12px;
    }

    .fern-reading {
        font-size: 22px;
        color: #8b5cf6;
        font-weight: 800;
        margin-bottom: 8px;
    }

    .fern-meaning {
        font-size: 22px;
        color: #ec4899;
        font-weight: 900;
        margin-bottom: 20px;
    }

    .fern-btn-row {
        display: flex;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 20px;
    }

    .fern-btn,
    .fern-btn-light {
        padding: 14px 24px;
        border-radius: 16px;
        font-weight: 900;
        text-decoration: none;
        border: none;
    }

    .fern-btn {
        background: linear-gradient(135deg, #ec4899, #8b5cf6);
        color: white !important;
    }

    .fern-btn-light {
        background: #eff6ff;
        color: #2563eb !important;
        border: 1px solid #bfdbfe;
    }

    #speechResultBox {
        margin-top: 20px;
        padding: 16px;
        border-radius: 18px;
        font-weight: 800;
        display: none;
    }

    #practiceFinishRow {
        margin-top: 26px;
    }
</style>

<div class="fern-practice-speak-page">

    <div class="fern-top">
        <div class="fern-title">🎤 {{ mode.label }} — {{ course.title|default:course_code }}</div>

        <div class="fern-progress-wrap">
            <p id="practiceSpeakingCounter">0 / {{ vocabularies|length }}</p>
            <div class="fern-progress">
                <span id="vocabProgress"></span>
            </div>
        </div>
    </div>

    <div class="fern-card">

        <div class="fern-word" id="vocabWord">-</div>
        <div class="fern-reading" id="vocabReading">-</div>
        <div class="fern-meaning" id="vocabMeaningTh">-</div>

        <div style="display:none;">
            <span id="vocabMeaningEn"></span>
            <span id="vocabExampleSentence"></span>
            <span id="vocabExampleReading"></span>
            <span id="vocabExampleTh"></span>
            <span id="vocabExampleEn"></span>
            <span id="vocabCounter"></span>
        </div>

        <div class="fern-btn-row">
            <button class="fern-btn-light" onclick="prevVocab()">← คำก่อนหน้า</button>
            <button class="fern-btn-light" onclick="speakCurrentWord()">🔊 ฟังเสียงคำศัพท์</button>
            <button class="fern-btn" onclick="startWordSpeaking()">🎙️ พูดตามคำนี้</button>
            <button class="fern-btn-light" onclick="nextVocab()">คำถัดไป →</button>
        </div>

        <div id="speechResultBox"></div>

        <div id="practiceFinishRow">
            <a id="finishSpeakingBtn" href="#"
                data-complete-url="{% url 'practice:complete' mode='speaking' course_code=course_code %}"
                class="fern-btn" style="display:none;">
                ส่งคะแนน →
            </a>
        </div>

    </div>

</div>

<script>
    window.VOCAB_PAGE = {
        courseCode: "{{ course_code|default:''|escapejs }}",
        courseLanguage: "{{ course.language|default:''|escapejs }}"
    };

    let vocabs = [
        {% for vocab in vocabularies %}
        {
            word: "{{ vocab.word|escapejs }}",
            reading: "{{ vocab.reading|default:vocab.pinyin|escapejs }}",
            pinyin: "{{ vocab.pinyin|escapejs }}",
            speech_aliases: "{{ vocab.speech_aliases|default:''|escapejs }}",
            meaning_th: "{{ vocab.meaning_th|escapejs }}",
            meaning_en: "{{ vocab.meaning_en|escapejs }}",
            language: "{{ vocab.language|default:''|escapejs }}",
            level: "{{ vocab.level|default:''|escapejs }}",
            course_code: "{{ course_code|default:''|escapejs }}",
            example_sentence: "{{ vocab.example_sentence|escapejs }}",
            example_reading: "{{ vocab.example_reading|escapejs }}",
            example_translation_th: "{{ vocab.example_translation_th|escapejs }}",
            example_translation_en: "{{ vocab.example_translation_en|escapejs }}"
        },
        {% endfor %}
    ];
</script>

<script src="{% static 'js/utils/speech-lang.js' %}"></script>
<script src="{% static 'js/pages/vocabulary.js' %}"></script>
<script src="{% static 'js/pages/practice_speaking.js' %}"></script>

<script>
    updateVocabCard();
</script>

{% endblock content %}
