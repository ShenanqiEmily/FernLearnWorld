# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then on Render use "New +" -> "Blueprint"
# and point it at the repo. Render reads this file and provisions everything
# below automatically. Values marked `sync: false` are NOT stored here (and
# therefore never committed to git) — Render will prompt you to fill them in
# once in the dashboard after the first deploy.

# Database: hosted on Neon (not Render) — the old Render free Postgres
# expired. DATABASE_URL is set manually in the Render dashboard below.

services:
  - type: web
    name: fernlearnworld
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # --- Core (auto-filled) ---
      - key: SECRET_KEY
        generateValue: true          # Render generates a random secret for you
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1" # RENDER_EXTERNAL_HOSTNAME is auto-added
                                      # by settings.py on top of this — add a
                                      # custom domain here too if you attach one

      # --- Database (Neon Postgres — paste the pooled connection string
      # from the Neon console, including ?sslmode=require) ---
      - key: DATABASE_URL
        sync: false

      # --- Secrets you must fill in yourself in the Render dashboard ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: OMISE_PUBLIC_KEY
        sync: false
      - key: OMISE_SECRET_KEY
        sync: false
